name: Build Android Geode mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android64 mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: v5.11.2

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-GD-AI-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
